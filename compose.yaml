name: geme-local

services:
  storefront:
    build:
      context: ./outputs/geme
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api/v1
      GEME_API_BASE_URL: http://geme-api:4000/api/v1
      AEGIS_AUTH_API_URL: http://aegis:5130
    ports:
      - "3000:3000"
    volumes:
      - ./outputs/geme:/app
      - storefront_node_modules:/app/node_modules
      - storefront_next:/app/.next
    depends_on:
      geme-api:
        condition: service_healthy
      aegis:
        condition: service_started
    command: pnpm dev

  admin:
    build:
      context: ./outputs
      dockerfile: geme-admin/Dockerfile
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api/v1
      GEME_API_BASE_URL: http://geme-api:4000/api/v1
      GEME_STOREFRONT_ASSETS_URL: http://storefront:3000
      AEGIS_AUTH_API_URL: http://aegis:5130
    ports:
      - "3001:3001"
    volumes:
      - ./outputs/geme-admin:/workspace/outputs/geme-admin
      - admin_node_modules:/workspace/outputs/geme-admin/node_modules
      - admin_next:/workspace/outputs/geme-admin/.next
    depends_on:
      geme-api:
        condition: service_healthy
      aegis:
        condition: service_started
    command: pnpm exec next dev --hostname 0.0.0.0 --port 3001 --webpack

  geme-api:
    build:
      context: ./outputs/geme-api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: "4000"
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      DATABASE_URL: ${GEME_DATABASE_URL:?Set GEME_DATABASE_URL in .env.docker}
      AEGIS_AUTH_API_URL: http://aegis:5130
      # POS365 credentials stay on the API container; never expose them to storefront/admin browsers.
      POS365_ENABLED: ${POS365_ENABLED:-false}
      POS365_API_BASE_URL: ${POS365_API_BASE_URL:-}
      POS365_USERNAME: ${POS365_USERNAME:-}
      POS365_PASSWORD: ${POS365_PASSWORD:-}
      POS365_BRANCH_ID: ${POS365_BRANCH_ID:-}
    ports:
      - "4000:4000"
    volumes:
      - ./outputs/geme-api:/app
      - geme_api_node_modules:/app/node_modules
    depends_on:
      aegis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4000/api/v1/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    command: >-
      sh -c 'pnpm db:generate && pnpm db:deploy && pnpm build &&
      (pnpm exec tsc -p tsconfig.build.json --watch & compiler=$$!;
      trap "kill $$compiler" EXIT INT TERM;
      exec node --watch dist/main.js)'

  aegis:
    build:
      context: ./outputs/aegis
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5130
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=Aegis_Security_Platform;User Id=sa;Password=${AEGIS_SQL_PASSWORD:?Set AEGIS_SQL_PASSWORD in .env.docker};Encrypt=False;TrustServerCertificate=True
      ConnectionStrings__Redis: redis:6379
      Database__ApplyMigrationsOnStartup: "true"
      Email__Host: ${AEGIS_EMAIL_HOST:-mailpit}
      Email__Port: ${AEGIS_EMAIL_PORT:-1025}
      Email__EnableSsl: ${AEGIS_EMAIL_ENABLE_SSL:-false}
      Email__Username: ${AEGIS_EMAIL_USERNAME:-local-dev}
      Email__Password: ${AEGIS_EMAIL_PASSWORD:-local-dev}
      Email__FromEmail: ${AEGIS_EMAIL_FROM_EMAIL:-no-reply@geme.local}
      Email__FromName: ${AEGIS_EMAIL_FROM_NAME:-GEME}
      Email__PublicBaseUrl: ${AEGIS_EMAIL_PUBLIC_BASE_URL:-http://localhost:5130}
      Otp__HashingKey: ${AEGIS_OTP_HASHING_KEY:?Set AEGIS_OTP_HASHING_KEY in .env.docker}
      PasswordHashing__WorkFactor: ${AEGIS_BCRYPT_WORK_FACTOR:-10}
      Jwt__Issuer: Aegis
      Jwt__Audience: AegisClient
    ports:
      - "5130:5130"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${AEGIS_SQL_PASSWORD:?Set AEGIS_SQL_PASSWORD in .env.docker}
    ports:
      - "1433:1433"
    volumes:
      - aegis_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - aegis_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  storefront_node_modules:
  storefront_next:
  admin_node_modules:
  admin_next:
  geme_api_node_modules:
  aegis_sql_data:
  aegis_redis_data:
