name: geme-local

services:
  storefront:
    build:
      context: ./outputs/geme
      dockerfile: Dockerfile
      args:
        GEME_API_BASE_URL: http://geme-api:4000/api/v1
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api/v1
        AEGIS_AUTH_API_URL: http://aegis:5130
        GEME_SITE_URL: ${GEME_SITE_URL:-https://geme.vn}
        MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
    environment:
      NODE_ENV: development
      CI: "true"
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api/v1
      GEME_API_BASE_URL: http://geme-api:4000/api/v1
      GEME_SITE_URL: ${GEME_SITE_URL:-https://geme.vn}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      AEGIS_AUTH_API_URL: http://aegis:5130
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./outputs/geme:/app
      - storefront_node_modules_v2:/app/node_modules
      - storefront_next:/app/.next
    depends_on:
      geme-api:
        condition: service_healthy
      aegis:
        condition: service_started
    command: node scripts/dev-warmup.mjs --hostname 0.0.0.0

  admin:
    build:
      context: ./outputs/geme-admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:4000/api/v1}
        GEME_STOREFRONT_ASSETS_URL: ${GEME_STOREFRONT_ASSETS_URL:-http://storefront:3000}
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api/v1
      GEME_API_BASE_URL: http://geme-api:4000/api/v1
      GEME_STOREFRONT_ASSETS_URL: http://storefront:3000
      AEGIS_AUTH_API_URL: http://aegis:5130
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./outputs/geme-admin/app:/app/app
      - ./outputs/geme-admin/lib:/app/lib
      - ./outputs/geme-admin/public:/app/public
      - ./outputs/geme-admin/proxy.ts:/app/proxy.ts
      - ./outputs/geme-admin/next.config.ts:/app/next.config.ts
      - ./outputs/geme-admin/tsconfig.json:/app/tsconfig.json
      - ./outputs/geme-admin/next-env.d.ts:/app/next-env.d.ts
      - admin_next_v2:/app/.next
    depends_on:
      geme-api:
        condition: service_healthy
      aegis:
        condition: service_started
    command: pnpm exec next dev --hostname 0.0.0.0 --port 3001 --webpack

  geme-api:
    build:
      context: ./outputs/geme-api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      CI: "true"
      PORT: "4000"
      ADMIN_AUTH_JWT_SECRET: ${ADMIN_AUTH_JWT_SECRET:?Set ADMIN_AUTH_JWT_SECRET to a random value of at least 32 characters in .env.docker}
      OPENAI_CONFIGURED: ${GEME_OPENAI_API_KEY:+true}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      DATABASE_URL: ${GEME_DATABASE_URL:?Set GEME_DATABASE_URL in .env.docker}
      REDIS_URL: redis://ai-redis:6379/0
      AI_STUDIO_ACTIVE_TASK_LIMIT: ${AI_STUDIO_ACTIVE_TASK_LIMIT:-5}
      AI_STUDIO_RATE_LIMIT_PER_MINUTE: ${AI_STUDIO_RATE_LIMIT_PER_MINUTE:-12}
      AI_CORE_URL: http://ai-core:8000
      AI_CORE_SHARED_SECRET: ${AI_CORE_SHARED_SECRET:?Set AI_CORE_SHARED_SECRET to a random value of at least 32 characters}
      PHOTOROOM_CONFIGURED: ${PHOTOROOM_API_KEY:+true}
      PHOTOROOM_SANDBOX: ${PHOTOROOM_SANDBOX:-false}
      SOCIAL_META_APP_ID: ${SOCIAL_META_APP_ID:-}
      SOCIAL_META_APP_SECRET: ${SOCIAL_META_APP_SECRET:-}
      SOCIAL_META_REDIRECT_URI: ${SOCIAL_META_REDIRECT_URI:-}
      SOCIAL_META_GRAPH_API_VERSION: ${SOCIAL_META_GRAPH_API_VERSION:-}
      SOCIAL_META_ADMIN_RETURN_URL: ${SOCIAL_META_ADMIN_RETURN_URL:-http://localhost:3001/}
      SOCIAL_META_ADMIN_ORIGINS: ${SOCIAL_META_ADMIN_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      SOCIAL_META_ENCRYPTION_KEY: ${SOCIAL_META_ENCRYPTION_KEY:-}
      SHOPEE_ENVIRONMENT: ${SHOPEE_ENVIRONMENT:-sandbox}
      SHOPEE_PARTNER_ID: ${SHOPEE_PARTNER_ID:-}
      SHOPEE_PARTNER_KEY: ${SHOPEE_PARTNER_KEY:-}
      SHOPEE_REDIRECT_URI: ${SHOPEE_REDIRECT_URI:-}
      SHOPEE_ADMIN_RETURN_URL: ${SHOPEE_ADMIN_RETURN_URL:-http://localhost:3001/?view=shopee}
      SHOPEE_TOKEN_ENCRYPTION_KEY: ${SHOPEE_TOKEN_ENCRYPTION_KEY:-}
      SHOPEE_INITIAL_SYNC_DAYS: ${SHOPEE_INITIAL_SYNC_DAYS:-30}
      SHOPEE_POLL_INTERVAL_MINUTES: ${SHOPEE_POLL_INTERVAL_MINUTES:-5}
      GEME_SITE_URL: ${GEME_SITE_URL:-https://geme.vn}
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-database}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PRIVATE_BUCKET_NAME: ${R2_PRIVATE_BUCKET_NAME:-}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      AEGIS_AUTH_API_URL: http://aegis:5130
      AEGIS_ORDER_EMAIL_URL: http://aegis:5130
      GEME_ORDER_EMAIL_API_KEY: ${GEME_ORDER_EMAIL_API_KEY:?Set GEME_ORDER_EMAIL_API_KEY in .env.docker}
      # POS365 credentials stay on the API container; never expose them to storefront/admin browsers.
      POS365_ENABLED: ${POS365_ENABLED:-false}
      POS365_API_BASE_URL: ${POS365_API_BASE_URL:-}
      POS365_USERNAME: ${POS365_USERNAME:-}
      POS365_PASSWORD: ${POS365_PASSWORD:-}
      POS365_BRANCH_ID: ${POS365_BRANCH_ID:-}
      # Viettel Post credentials and sender details stay on the API container.
      VIETTELPOST_ENABLED: ${VIETTELPOST_ENABLED:-false}
      VIETTELPOST_API_BASE_URL: ${VIETTELPOST_API_BASE_URL:-https://partnerdev.viettelpost.vn}
      VIETTELPOST_TOKEN: ${VIETTELPOST_TOKEN:-}
      VIETTELPOST_SENDER_NAME: ${VIETTELPOST_SENDER_NAME:-}
      VIETTELPOST_SENDER_PHONE: ${VIETTELPOST_SENDER_PHONE:-}
      VIETTELPOST_SENDER_ADDRESS: ${VIETTELPOST_SENDER_ADDRESS:-}
      VIETTELPOST_WEBHOOK_TOKEN: ${VIETTELPOST_WEBHOOK_TOKEN:-}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./outputs/geme-api:/app
      - geme_api_node_modules_v2:/app/node_modules
    depends_on:
      aegis:
        condition: service_started
      ai-redis:
        condition: service_healthy
      ai-core:
        condition: service_healthy
    networks:
      - default
      - ai_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4000/api/v1/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    command: >-
      sh -c 'pnpm db:generate && pnpm db:deploy && pnpm build &&
      (pnpm exec tsc -p tsconfig.build.json --watch & compiler=$$!;
      trap "kill $$compiler" EXIT INT TERM;
      exec node --watch dist/main.js)'

  ai-worker:
    build:
      context: ./outputs/geme-api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      CI: "true"
      DATABASE_URL: ${GEME_DATABASE_URL:?Set GEME_DATABASE_URL in .env.docker}
      REDIS_URL: redis://ai-redis:6379/0
      AI_CORE_URL: http://ai-core:8000
      AI_CORE_SHARED_SECRET: ${AI_CORE_SHARED_SECRET:?Set AI_CORE_SHARED_SECRET to a random value of at least 32 characters}
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-database}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PRIVATE_BUCKET_NAME: ${R2_PRIVATE_BUCKET_NAME:-}
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-3}
      SOCIAL_META_APP_ID: ${SOCIAL_META_APP_ID:-}
      SOCIAL_META_APP_SECRET: ${SOCIAL_META_APP_SECRET:-}
      SOCIAL_META_REDIRECT_URI: ${SOCIAL_META_REDIRECT_URI:-}
      SOCIAL_META_GRAPH_API_VERSION: ${SOCIAL_META_GRAPH_API_VERSION:-}
      SOCIAL_META_ADMIN_RETURN_URL: ${SOCIAL_META_ADMIN_RETURN_URL:-http://localhost:3001/}
      SOCIAL_META_ADMIN_ORIGINS: ${SOCIAL_META_ADMIN_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      SOCIAL_META_ENCRYPTION_KEY: ${SOCIAL_META_ENCRYPTION_KEY:-}
      SOCIAL_WORKER_CONCURRENCY: ${SOCIAL_WORKER_CONCURRENCY:-2}
    volumes:
      - ./outputs/geme-api:/app
      - geme_api_node_modules_v2:/app/node_modules
    depends_on:
      geme-api:
        condition: service_healthy
      ai-redis:
        condition: service_healthy
      ai-core:
        condition: service_healthy
    networks:
      - default
      - ai_internal
    restart: unless-stopped
    command: pnpm ai:worker
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  social-worker:
    build:
      context: ./outputs/geme-api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      CI: "true"
      DATABASE_URL: ${GEME_DATABASE_URL:?Set GEME_DATABASE_URL in .env.docker}
      REDIS_URL: redis://ai-redis:6379/0
      SOCIAL_META_APP_ID: ${SOCIAL_META_APP_ID:-}
      SOCIAL_META_APP_SECRET: ${SOCIAL_META_APP_SECRET:-}
      SOCIAL_META_REDIRECT_URI: ${SOCIAL_META_REDIRECT_URI:-}
      SOCIAL_META_GRAPH_API_VERSION: ${SOCIAL_META_GRAPH_API_VERSION:-}
      SOCIAL_META_ADMIN_RETURN_URL: ${SOCIAL_META_ADMIN_RETURN_URL:-http://localhost:3001/}
      SOCIAL_META_ADMIN_ORIGINS: ${SOCIAL_META_ADMIN_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      SOCIAL_META_ENCRYPTION_KEY: ${SOCIAL_META_ENCRYPTION_KEY:-}
      SOCIAL_WORKER_CONCURRENCY: ${SOCIAL_WORKER_CONCURRENCY:-2}
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-database}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PRIVATE_BUCKET_NAME: ${R2_PRIVATE_BUCKET_NAME:-}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
    volumes:
      - ./outputs/geme-api:/app
      - geme_api_node_modules_v2:/app/node_modules
    depends_on:
      geme-api:
        condition: service_healthy
      ai-redis:
        condition: service_healthy
    networks:
      - default
      - ai_internal
    restart: unless-stopped
    command: pnpm social:worker
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  shopee-worker:
    build:
      context: ./outputs/geme-api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      CI: "true"
      DATABASE_URL: ${GEME_DATABASE_URL:?Set GEME_DATABASE_URL in .env.docker}
      REDIS_URL: redis://ai-redis:6379/0
      SHOPEE_ENVIRONMENT: ${SHOPEE_ENVIRONMENT:-sandbox}
      SHOPEE_PARTNER_ID: ${SHOPEE_PARTNER_ID:-}
      SHOPEE_PARTNER_KEY: ${SHOPEE_PARTNER_KEY:-}
      SHOPEE_REDIRECT_URI: ${SHOPEE_REDIRECT_URI:-}
      SHOPEE_ADMIN_RETURN_URL: ${SHOPEE_ADMIN_RETURN_URL:-http://localhost:3001/?view=shopee}
      SHOPEE_TOKEN_ENCRYPTION_KEY: ${SHOPEE_TOKEN_ENCRYPTION_KEY:-}
      SHOPEE_INITIAL_SYNC_DAYS: ${SHOPEE_INITIAL_SYNC_DAYS:-30}
      SHOPEE_POLL_INTERVAL_MINUTES: ${SHOPEE_POLL_INTERVAL_MINUTES:-5}
      SHOPEE_WORKER_CONCURRENCY: ${SHOPEE_WORKER_CONCURRENCY:-2}
    volumes:
      - ./outputs/geme-api:/app
      - geme_api_node_modules_v2:/app/node_modules
    depends_on:
      geme-api:
        condition: service_healthy
      ai-redis:
        condition: service_healthy
    restart: unless-stopped
    command: pnpm shopee:worker
    networks:
      - default
      - ai_internal
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ai-core:
    build:
      context: ./outputs/ai-core
      dockerfile: Dockerfile
    environment:
      AI_CORE_SHARED_SECRET: ${AI_CORE_SHARED_SECRET:?Set AI_CORE_SHARED_SECRET to a random value of at least 32 characters}
      OPENAI_API_KEY: ${GEME_OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${GEME_OPENAI_TEXT_MODEL:-gpt-6-astra}
      OPENAI_IMAGE_ANALYSIS_MODEL: ${GEME_OPENAI_IMAGE_ANALYSIS_MODEL:-${GEME_OPENAI_TEXT_MODEL:-gpt-6-luna}}
      OPENAI_IMAGE_MODEL: ${GEME_OPENAI_IMAGE_MODEL:-gpt-image-2.5-sunburst}
      PHOTOROOM_API_KEY: ${PHOTOROOM_API_KEY:-}
      PHOTOROOM_SANDBOX: ${PHOTOROOM_SANDBOX:-false}
      LOG_LEVEL: ${AI_CORE_LOG_LEVEL:-INFO}
    networks:
      - default
      - ai_internal
    restart: unless-stopped

  aegis:
    build:
      context: ./outputs/aegis
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5130
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=Aegis_Security_Platform;User Id=sa;Password=${AEGIS_SQL_PASSWORD:?Set AEGIS_SQL_PASSWORD in .env.docker};Encrypt=False;TrustServerCertificate=True
      ConnectionStrings__Redis: redis:6379
      Database__ApplyMigrationsOnStartup: "true"
      Email__Host: ${AEGIS_EMAIL_HOST:-mailpit}
      Email__Port: ${AEGIS_EMAIL_PORT:-1025}
      Email__EnableSsl: ${AEGIS_EMAIL_ENABLE_SSL:-false}
      Email__Username: ${AEGIS_EMAIL_USERNAME:-local-dev}
      Email__Password: ${AEGIS_EMAIL_PASSWORD:-local-dev}
      Email__FromEmail: ${AEGIS_EMAIL_FROM_EMAIL:-no-reply@geme.local}
      Email__FromName: ${AEGIS_EMAIL_FROM_NAME:-GEME}
      Email__PublicBaseUrl: ${AEGIS_EMAIL_PUBLIC_BASE_URL:-http://localhost:5130}
      Otp__HashingKey: ${AEGIS_OTP_HASHING_KEY:?Set AEGIS_OTP_HASHING_KEY in .env.docker}
      PasswordHashing__WorkFactor: ${AEGIS_BCRYPT_WORK_FACTOR:-10}
      Jwt__Issuer: Aegis
      Jwt__Audience: AegisClient
      Jwt__Key: ${AEGIS_JWT_KEY:?Set AEGIS_JWT_KEY in .env.docker}
      InternalApi__OrderEmailKey: ${GEME_ORDER_EMAIL_API_KEY:?Set GEME_ORDER_EMAIL_API_KEY in .env.docker}
    ports:
      - "127.0.0.1:5130:5130"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      # Use Express by default to match production. Developer can be selected
      # only for local development/testing that needs its extra features.
      MSSQL_PID: ${AEGIS_SQL_EDITION:-Express}
      MSSQL_SA_PASSWORD: ${AEGIS_SQL_PASSWORD:?Set AEGIS_SQL_PASSWORD in .env.docker}
    # SQL is reachable only by services on the private Compose network.
    # Do not publish 1433 on the Windows host; AEGIS connects to sqlserver:1433.
    volumes:
      - aegis_sql_express_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - aegis_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - geme_ai_redis_data:/data
    networks:
      - ai_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  storefront_node_modules:
  storefront_node_modules_v2:
  storefront_next:
  admin_next_v2:
  geme_api_node_modules:
  geme_api_node_modules_v2:
  aegis_sql_express_data:
  aegis_redis_data:
  geme_ai_redis_data:

networks:
  ai_internal:
    internal: true
